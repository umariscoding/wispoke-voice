[project]
name = "wispoke-voice"
version = "0.1.0"
description = "Wispoke voice booking agent — LiveKit Agents worker"
requires-python = ">=3.11"

dependencies = [
    "livekit-agents>=1.0.0,<2",
    "livekit-plugins-deepgram>=1.0.0,<2",
    "livekit-plugins-openai>=1.0.0,<2",
    "livekit-plugins-anthropic>=1.0.0,<2",
    "livekit-plugins-elevenlabs>=1.0.0,<2",
    "livekit-plugins-silero>=1.0.0,<2",
    "livekit-plugins-turn-detector>=1.0.0,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "PyJWT>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
wispoke-voice = "wispoke_voice.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispoke_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
