# Build config for Railway (Nixpacks).
#
# This is a LiveKit Agents WORKER, not a web service — it dials OUT to LiveKit
# Cloud and has no inbound HTTP. Deploy as a worker/background service with no
# public domain.
#
# Two things this file guarantees that the default detection missed:
#   1. `pip install .` — installs the `wispoke_voice` package itself (src/
#      layout means just having the files on disk isn't enough; without this
#      you get `ModuleNotFoundError: No module named 'wispoke_voice'`).
#   2. `download-files` — fetches the turn-detector ONNX model at build time
#      so the first call doesn't fail with `model_q8.onnx not found`.
#
# Python is pinned to 3.11 via .python-version (torch/livekit ship cp311
# wheels; 3.13 wheels are not always available).

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
]

[phases.build]
cmds = [
  ". /opt/venv/bin/activate && pip install .",
  ". /opt/venv/bin/activate && python -m wispoke_voice.worker download-files",
]

[start]
cmd = ". /opt/venv/bin/activate && python -m wispoke_voice.worker start"
